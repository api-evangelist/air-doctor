name: Air Doctor
description: >-
  Air Doctor is a digital health platform that connects travelers and people
  living abroad with a global network of vetted private doctors and specialists,
  offering in-person clinic visits, home visits, and telemedicine appointments
  in multiple languages across more than 75 countries. Users search for and book
  local doctors through the Air Doctor mobile app and web app, and the company
  operates a large B2B business embedding its provider network into travel
  insurance, assistance, and health-plan partners (including brands such as
  Allianz Global Assistance, ERGO, World Nomads, and Charles Taylor). Air Doctor
  is backed by Lightspeed Venture Partners. This API Evangelist profile tracks
  the company's public developer, partner, and web surface; Air Doctor does not
  publish a public API or developer portal at this time, so this profile is
  maintained as an identity and web-property record.
